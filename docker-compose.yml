# Local development stack: PostgreSQL, Redis, API, worker and web app.
#
#   cp .env.example .env        # then edit values
#   docker compose up --build
#   docker compose exec api flask --app wsgi db upgrade
#   docker compose exec api flask --app wsgi aszda create-admin
#
# Web app: http://localhost:3000   API health: http://localhost:3000/api/health
# This file is for development. See docs/DEPLOYMENT.md for production.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aszda
      POSTGRES_PASSWORD: aszda
      POSTGRES_DB: aszda
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aszda"]
      interval: 5s
      retries: 10
    # No host port: the API and worker reach the database over Docker's own
    # network, so this does not clash with a PostgreSQL already on your computer.
    # To inspect it: docker compose exec db psql -U aszda

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://aszda:aszda@db:5432/aszda
      REDIS_URL: redis://redis:6379/0
      ASZDA_RATELIMIT_STORAGE_URI: redis://redis:6379/1
      ASZDA_LOCAL_STORAGE_ROOT: /app/var/storage
    volumes:
      - media:/app/var/storage
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    # No host port: the web app reaches the API over Docker's network, and your
    # browser only needs port 3000. Check the API with:
    #   curl http://localhost:3000/api/health

  worker:
    build: ./backend
    # -B also runs Celery beat (stuck-job recovery, plan expiry). Run beat in ONE process only.
    command: ["celery", "-A", "celery_worker.celery", "worker", "-B", "--loglevel=info", "-Q", "aszda", "--concurrency=2"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://aszda:aszda@db:5432/aszda
      REDIS_URL: redis://redis:6379/0
      ASZDA_LOCAL_STORAGE_ROOT: /app/var/storage
    volumes:
      - media:/app/var/storage
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }

  web:
    build:
      context: ./frontend
      args:
        # Fixed at build time by Next.js (see frontend/Dockerfile).
        ASZDA_API_URL: http://api:5000
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  pgdata:
  media:
